name: Scripts CI

# Bash betikleri için kod kalitesi: sözdizimi, help/version, shellcheck ve bats.
on:
  push:
    paths:
      - '**/*.sh'
      - '*.sh'
      - 'install_i18n.sh'
      - 'system_utils/**'
      - 'tests/**'
      - '.github/workflows/scripts-ci.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '*.sh'
      - 'install_i18n.sh'
      - 'system_utils/**'
      - 'tests/**'
      - '.github/workflows/scripts-ci.yml'

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bash -n + --help/--version + (bats varsa) testler. Root gerektirmez.
      - name: Sözdizimi ve help/version (tests/run.sh)
        run: bash tests/run.sh

      - name: ShellCheck kur
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # Gerçek hatalar (error) CI'ı FAIL eder.
      - name: ShellCheck (error → FAIL)
        run: |
          shellcheck --severity=error -x \
            install.sh update.sh uninstall.sh install_i18n.sh system_utils/*.sh

      # Uyarılar bilgi amaçlıdır; CI'ı kırmaz.
      - name: ShellCheck (warning → bilgi)
        continue-on-error: true
        run: |
          shellcheck --severity=warning -x \
            install.sh update.sh uninstall.sh install_i18n.sh system_utils/*.sh

      - name: bats kur
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local

      - name: bats testleri
        run: bats tests/
