<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>{{ report_name }}</title>
    <style>
        @page {
            size: A6 portrait;
            margin: 0;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ececec;
            -webkit-print-color-adjust: exact;
        }

        body {
            font-family: Arial, sans-serif;
            color: #f8fafc;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 30px;
            text-align: center;
            background-color: #f1f1f1;
        }

        .header {
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00011f;
            margin-bottom: 5px;
        }

        .branch-name {
            font-size: 12px;
            color: #94a3b8;
        }

        .table-info {
            background-color: #f1f1f1;
            border: 1px solid #111111;
            border-radius: 12px;
            padding: 12px 20px;
            margin: 20px auto;
            display: inline-block;
            min-width: 140px;
        }

        .table-name {
            font-size: 24px;
            font-weight: bold;
            color: #111111;
            margin: 0;
        }

        .zone-name {
            font-size: 11px;
            color: #7e7e7e;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-top: 4px;
        }

        .qr-wrapper {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 20px auto;
        }

        .qr-image {
            width: 180px;
            height: 180px;
            display: block;
        }

        .footer {
            margin-top: 20px;
        }

        .instructions {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            max-width: 220px;
            margin: 0 auto;
        }

        .instructions strong {
            color: #111111;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="brand">RAMIS ERP</div>
            <div class="branch-name">{{ branch.name }}</div>
        </div>

        <div class="table-info">
            <div class="table-name">{{ table.name }}</div>
            <div class="zone-name">{{ zone.name }}</div>
        </div>

        <div class="qr-wrapper">
            <img class="qr-image" src="{{ qr_code_base64 }}" alt="Masa QR Kodu" />
        </div>

        <div class="footer">
            <div class="instructions">
                Siparişinizi vermek veya menüyü incelemek için lütfen <strong>QR kodu taratın</strong>.
            </div>
        </div>
    </div>
</body>

</html>
