<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramis — Sunucu Ayarı</title>
  <style>
    :root {
      --bg: radial-gradient(circle at top, #1e1b4b 0%, #09090b 100%);
      --card: rgba(24, 24, 27, 0.85);
      --border: rgba(63, 63, 70, 0.5);
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #fafafa;
      --muted: #a1a1aa;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.35rem; margin-bottom: 0.35rem; }
    p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; }
    input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: rgba(9, 9, 11, 0.7);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: var(--primary); }
    button {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 0.75rem;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 0.875rem;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sunucu Bağlantısı</h1>
    <p>Backend sunucu adresini girin (ör. <code>http://192.168.1.10:8000</code>). Sonraki adımda şube ve istasyon seçeceksiniz.</p>
    <div id="error" class="error"></div>
    <form id="setup-form">
      <label for="apiUrl">API Adresi</label>
      <input id="apiUrl" name="apiUrl" type="url" placeholder="http://192.168.1.10:8000" required autocomplete="url" />
      <button type="submit" id="submit-btn">Devam</button>
    </form>
  </div>
  <script>
    const form = document.getElementById("setup-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const apiUrlInput = document.getElementById("apiUrl");

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add("visible");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("visible");
      const apiUrl = apiUrlInput.value.trim().replace(/\/$/, "");
      if (!apiUrl) {
        showError("API adresi gerekli.");
        return;
      }
      submitBtn.disabled = true;
      try {
        const result = await window.electronAPI.saveApiUrl({ apiUrl });
        if (!result?.success) {
          showError(result?.error || "Kaydedilemedi.");
          submitBtn.disabled = false;
        }
      } catch (err) {
        showError("Bağlantı hatası: " + (err?.message || String(err)));
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
